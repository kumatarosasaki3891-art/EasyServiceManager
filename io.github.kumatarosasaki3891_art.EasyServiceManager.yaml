app-id: io.github.kumatarosasaki3891_art.EasyServiceManager
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: EasyServiceManager

finish-args:
  # Avalonia UI / Wayland / X11
  - --socket=x11
  - --share=ipc
  - --device=dri
  # ネットワークアクセス（QRレポート転送用HTTPサーバーおよびローカル通信）
  - --share=network
  # ダウンロードフォルダーへのアクセス（診断レポートのエクスポート・保存）
  - --filesystem=xdg-download
  # ポータル連携（ファイル保存ダイアログ、既定ブラウザ起動）
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.Flatpak
  # ホストの systemd サービス情報参照
  - --system-talk-name=org.freedesktop.systemd1

sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10

build-options:
  prepend-path: /usr/lib/sdk/dotnet10/bin
  append-ld-library-path: /usr/lib/sdk/dotnet10/lib
  prepend-pkg-config-path: /usr/lib/sdk/dotnet10/lib/pkgconfig
  env:
    DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

modules:
  - name: easyservicemanager
    buildsystem: simple
    build-commands:
      # 事前取得した NuGet パッケージ（nuget-sources）を参照して自己完結バイナリを発行
      - dotnet publish EasyServiceManager/EasyServiceManager.fsproj -c Release -r linux-x64 --self-contained true --source ./nuget-sources -o /app/lib/EasyServiceManager

      # 起動コマンド (/app/bin/EasyServiceManager) のシンボリックリンク作成
      - install -d /app/bin
      - ln -s /app/lib/EasyServiceManager/EasyServiceManager /app/bin/EasyServiceManager

      # .desktop ファイルのインストール
      - install -Dm644 io.github.kumatarosasaki3891_art.EasyServiceManager.desktop /app/share/applications/io.github.kumatarosasaki3891_art.EasyServiceManager.desktop

      # metainfo.xml のインストール
      - install -Dm644 io.github.kumatarosasaki3891_art.EasyServiceManager.metainfo.xml /app/share/metainfo/io.github.kumatarosasaki3891_art.EasyServiceManager.metainfo.xml

      # アプリアイコン (256x256) のインストール
      - install -Dm644 EasyServiceManager/Assets/icon_300.png /app/share/icons/hicolor/256x256/apps/io.github.kumatarosasaki3891_art.EasyServiceManager.png

    sources:
      # Flathub 審査・本番ビルド用（タグおよびコミットSHA固定）
      - type: git
        url: https://github.com/kumatarosasaki3891-art/EasyServiceManager.git
        tag: linux-v1.1.0
        commit: 00424bff76165b7712a8f83eeef74ed57d29288b
      # オフラインビルド用 NuGet パッケージ定義
      - nuget-sources.json
